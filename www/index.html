<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Gordeh | گرده</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/capacitor.js" defer></script>
    <script src="assets/scripts.js" defer></script>
</head>

<body>
    <div class="card" id="loading-card">
        <img src="assets/logo.png">
        <div class="spinner"></div>
        <div class="text">در حال بارگذاری...</div>
        <div class="hint">برای تجربه بهتر لطفاً VPN خود را خاموش کنید</div>
    </div>

    <div class="card hidden" id="offline-card">
        <div class="icon">!</div>
        <div class="text">اتصال اینترنت برقرار نیست</div>
        <div class="hint">برای تجربه بهتر لطفاً VPN خود را خاموش کنید</div>
        <div class="countdown" id="countdown"></div>
        <button class="retry-btn" id="retry-btn" type="button">
            <span class="btn-spinner"></span>
            <span class="btn-label" id="btn-label">تلاش مجدد</span>
        </button>
    </div>
</body>
</html>
